# From the open conversation, attach the first photo in the system picker and send it
# (docs/blobs.md). Run by phone-joins-serchat.mjs with PHONE_FILE=1.
appId: org.sereus.chat
---
- tapOn: "Attach"
- tapOn:
    id: "media-gallery"
# The system picker differs by Android version; both label a photo "Photo taken on …".
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 30000
- tapOn:
    text: "Photo taken on.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "staged-attachments"
    timeout: 30000
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    notVisible:
      id: "staged-attachments"
    timeout: 120000
