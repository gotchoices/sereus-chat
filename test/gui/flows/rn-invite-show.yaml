# Make an invitation into a new strand and leave it on screen (phones-talk.mjs reads the link).
appId: org.sereus.chat
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Strands"
    timeout: 120000
- openLink: chat://invite
- extendedWaitUntil:
    visible: "Make an invitation"
    timeout: 60000
- scrollUntilVisible:
    element: "Make an invitation"
    direction: DOWN
    timeout: 20000
- tapOn: "Make an invitation"
# A slow phone just launched (the S7) can fail the first try ("Could not get through just now"):
# press Retry, as a person would, until the invitation shows.
- repeat:
    while:
      notVisible: "Make another invitation"
    times: 12
    commands:
      - runFlow:
          when:
            visible: "Retry"
          commands:
            - tapOn: "Retry"
      - extendedWaitUntil:
          visible: "Make another invitation"
          timeout: 10000
          optional: true
- assertVisible: "Make another invitation"
